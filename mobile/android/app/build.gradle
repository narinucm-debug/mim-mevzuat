apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.mimmevzuat.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mimmevzuat.app"
        // Chaquopy 17.x en az API 24 (Android 7.0) gerektiriyor.
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            // TÜM ana ABI'ler dahil edilir. Yalnızca ARM (armeabi-v7a/
            // arm64-v8a) hedeflenmişti, ama BİRÇOK ucuz/eski Android
            // TABLET Intel x86/x86_64 işlemci kullanıyor - bu durumda
            // Chaquopy'nin native kütüphaneleri (libpython vb.) APK'da
            // hiç bulunmadığından uygulama açılışta anında çöküyordu
            // (2026-08-19, kullanıcı tabletinde doğrulandı). APK biraz
            // büyür ama gerçek cihaz uyumluluğu önceliklidir.
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        // mim_mevzuat cekirdek motoru (models/citation_enforcer/retrieval/
        // composer/rules/nlu/jurisdictions/assistant) SADECE stdlib kullanir
        // (bkz. 2026-08-19 dogrulamasi: bos bir venv'de PyMuPDF/requests/
        // certifi OLMADAN calisiyor) - bu yuzden pip{} blogu bos birakilabilir.
        // web/, ingestion/mevzuat_gov_tr.py, cli.py gibi masaustu/web'e ozel
        // alt modulleri Android tarafinda hic import ETMEYECEGIZ.
        python {
            // buildPython BİLEREK belirtilmiyor: Chaquopy PATH üzerinden
            // uygun bir Python'u otomatik bulur. Bunu makine-özel mutlak
            // bir yola (ör. geliştiricinin kendi kullanıcı dizini) sabitlemek
            // hem taşınabilirliği bozar hem de GitHub Actions (Ubuntu)
            // üzerinde çalışmaz. Yerelde derlerken PATH'te bir python3/
            // python komutunun bulunduğundan emin olun.
            pip {
                // Bilerek bos: cekirdek motor ek bagimlilik gerektirmiyor.
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            // MİM MEVZUAT Python motorunun TEK kaynagi: repo kokundeki
            // src/ dizini. Kopyalama YOK - Windows/Web ile ayni kod.
            python.srcDir "../../../src"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
